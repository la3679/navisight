name: CI

# Runs the gates a change has to clear. Nothing here is advisory: every job
# fails the build.
#
# ## What this workflow deliberately does NOT do
#
# **It never downloads the AIS dataset.** The source file is ~2 GB and is kept
# out of Git on purpose (ADR-0007). Fetching it in CI would make every run slow
# and fragile, and would tie the build to a third party's uptime for no gain —
# no test needs it. Integration tests run against a *synthetic* fixture in a
# throwaway database, so a green build never proves anything about the real
# import, and is never asked to.
#
# **It never needs an LLM key.** The copilot's whole test suite runs against the
# deterministic offline provider. `secrets.OPENAI_API_KEY` is not referenced
# anywhere below, which is what makes this workflow safe to run on a fork's
# pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Match the versions the project is developed against, so a CI-only failure
  # is a real difference rather than a toolchain drift.
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # --------------------------------------------------------------- secrets
  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs history to scan commits, not just the working tree —
          # a credential removed in a later commit is still in the repository.
          fetch-depth: 0

      - name: Scan for committed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- backend
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      # Integration tests need a real MongoDB: the queries under test are
      # aggregation pipelines and geospatial index scans, and a mock would
      # assert that the mock behaves. It holds only synthetic fixtures.
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        # `--extra ai` so the OpenAI provider is importable and its unit tests
        # run. Installing the SDK is not the same as configuring a provider:
        # LLM_PROVIDER stays unset, so nothing can reach the network.
        run: uv sync --all-groups --extra ai

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy .

      - name: Tests
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: navisight_ci
          MONGODB_TEST_DATABASE: navisight_ci_test
          APP_ENV: test
          # Explicitly empty. The copilot's tests configure the deterministic
          # provider themselves; leaving this unset here proves the shipped
          # default — "not configured" — is the one CI exercises.
          LLM_PROVIDER: ""
        run: uv run pytest -q

  # --------------------------------------------------------------- frontend
  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        # `pnpm test` does not stage the MapLibre worker; the worker tests
        # assert that `public/maplibre/` is present and correct, so the sync
        # has to have run. This is the guard that would have caught ADR-0010's
        # bug before a browser ever did.
        run: pnpm sync:map-worker && pnpm test

      - name: Build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
        run: pnpm build

  # -------------------------------------------------------------------- e2e
  e2e:
    name: End-to-end — real browser, real API, synthetic data
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [api, web]

    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - name: Install API dependencies
        working-directory: apps/api
        run: uv sync --all-groups

      - name: Install web dependencies
        working-directory: apps/web
        run: pnpm install --frozen-lockfile

      - name: Seed a synthetic archive
        # Generates a small AIS CSV and imports it. Hand-checkable, seconds to
        # build, and — crucially — not the real dataset.
        working-directory: apps/api
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: navisight_e2e
        run: uv run python ../../scripts/data/seed_e2e_dataset.py

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm e2e:install

      - name: Run end-to-end tests
        working-directory: apps/web
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DATABASE: navisight_e2e
          # The deterministic provider, so the copilot's screen is exercised
          # end to end with no key and no network.
          LLM_PROVIDER: mock
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8000
        run: pnpm e2e

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
